name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # sentence-transformers pulls in torch, whose default Linux wheel
      # bundles the CUDA runtime (~2.5 GB of nvidia-* packages). CI has no
      # GPU and never loads a real model, so install the CPU-only build
      # first and let the editable install find the requirement satisfied.
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # backend/openapi.json is kept in sync with the FastAPI app by the
      # backend's test_openapi.py; this step keeps the generated TS types in
      # sync with that file. A contract change therefore fails here, or as a
      # type error in the build below -- never as runtime drift.
      - name: API types match backend/openapi.json
        run: npm run check:api

      - name: Prettier
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test -- --watch=false
