version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # 2.x breaks table text (see backend/pyproject.toml); retest by hand.
      # By version: update-types cannot match, since a range requirement
      # gives Dependabot no current version to compare with.
      - dependency-name: pymupdf
        versions:
          - ">=2.0"
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch
