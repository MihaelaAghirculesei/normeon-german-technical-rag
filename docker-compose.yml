services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: normeon
      POSTGRES_PASSWORD: normeon
      POSTGRES_DB: normeon
    ports:
      - "5433:5432"
    volumes:
      - normeon_db_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U normeon"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://normeon:normeon@db:5432/normeon
      ENVIRONMENT: development
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  normeon_db_data:
