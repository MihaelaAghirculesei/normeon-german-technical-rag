[project]
name = "normeon"
version = "0.1.0"
description = "Cited RAG assistant for German technical documentation"
requires-python = ">=3.13"
dependencies = [
    "fastapi~=0.138",
    "uvicorn[standard]~=0.36",
    "pydantic~=2.11",
    "pydantic-settings~=2.7",
    "sqlalchemy[asyncio]~=2.0",
    "asyncpg~=0.30",
    "alembic~=1.14",
    "pgvector~=0.3",
    "httpx~=0.28",
    "structlog>=25,<27",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "tenacity",
    "pymupdf~=1.25",
    "sentence-transformers>=3.3,<7.0",
    "python-multipart~=0.0.12",
    "pyyaml~=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers[postgres]",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
