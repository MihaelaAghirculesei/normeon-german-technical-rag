    - { document: "Lastenheft-EPS-v2.0.docx", section: "3.2" }
  should_abstain: false
  difficulty: easy
  notes: "Wie Q001, aber absichtlich ohne den Code LH-3.2.1 zu nennen -- testet, ob reine Stichwortsuche (nicht Code-Lookup) beide Versionen findet."

- id: Q010
  category: conflict
  question: "Auf welchen Abschnitt der UN R79 verweist das Lastenheft EPS bei der Anforderung LH-3.2.1, und hat sich dieser Verweis zwischen v1.2 und v2.0 geändert?"
  expected_answer_points:
