  category: cross_reference
  question: "Welche StVZO-Vorschrift regelt die Bremse einachsiger Zug- oder Arbeitsmaschinen, wenn diese laut § 41 Absatz 2 StVZO mit einer weiteren Achse verbunden und vom Sitz aus gefahren werden?"
