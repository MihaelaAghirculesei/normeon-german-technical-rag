  difficulty: hard
  notes: "Der Verweis auf UN R79 Abschnitt 5.1.2 bleibt in beiden Versionen unverändert -- nur der Zahlenwert ändert sich. Testet Genauigkeit statt pauschales Konflikt-Flaggen."

