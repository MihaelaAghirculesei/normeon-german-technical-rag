- id: Q021
  category: cross_reference
  question: "Welche Vorschrift muss laut § 32 StVZO bei der Messung der höchstzulässigen Breite, Höhe und Länge von Fahrzeugen zusätzlich berücksichtigt werden, und was regelt diese Vorschrift?"
