    - "§ 42 Absatz 3"
    - "austauschbare Ladungsträger"
  gold_sources:
    - { document: "StVZO.pdf", section: "§32", page: 21 }
    - { document: "StVZO.pdf", section: "§42", page: 45 }
  should_abstain: false
  difficulty: medium
  notes: "§ 32 Absätze 1-5 verweisen wiederholt auf '(§ 42 Absatz 3)'; § 42 Absatz 3 definiert dort 'austauschbare Ladungsträger' und das Leergewicht."

- id: Q022
